name: Release to Maven Central

# Publish a GitHub release whose tag is the version to release (e.g. "2.2.0" or "v2.2.0").
# The workflow sets that version in the pom, builds, signs and publishes to Maven Central.
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 2.2.0)'
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: maven-central   # optional: add required reviewers to this environment for a manual approval gate
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name || github.ref }}

    - name: Determine version
      id: version
      env:
        TAG: ${{ github.event.release.tag_name }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        VERSION="${INPUT_VERSION:-$TAG}"
        VERSION="${VERSION#v}"
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::'$VERSION' is not a valid release version (expected e.g. 2.2.0)"
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Set up JDK 25 and Maven Central credentials
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
        server-id: central
        server-username: MAVEN_CENTRAL_USERNAME
        server-password: MAVEN_CENTRAL_PASSWORD
        gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE

    - name: Set release version
      run: mvn -B versions:set -DnewVersion="${{ steps.version.outputs.version }}" -DgenerateBackupPoms=false

    - name: Build, sign and publish
      run: mvn -B deploy -Psonatype-oss-release
      env:
        MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
